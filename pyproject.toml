[tool.poetry]
name = "microrts-graph-state-encoder-gssl"
version = "0.1.0"
description = "MicroRTS Graph State Encoder"
authors = ["Pavan Kantharaju <pavank92@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
torch = "^2.0.1"
torchvision = "^0.15.2"
numpy = "^1.25.0"
pandas = "^2.0.2"
seaborn = "^0.12.2"
jupyterlab = "^4.0.2"
tqdm = "^4.65.0"
torch-geometric = "^2.3.1"
wandb = "^0.15.4"
scipy = "^1.11.1"
accelerate = "^1.1.0"
diffusers = "^0.31.0"
umap-learn = "^0.5.7"
scikit-learn-extra = "^0.3.0"


[tool.poetry.group.dev.dependencies]
pylint = "^2.17.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
